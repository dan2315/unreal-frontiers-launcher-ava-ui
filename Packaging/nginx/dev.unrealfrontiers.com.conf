# dev.unrealfrontiers.com: the DEV backend (the user's PC, reached over WireGuard at 10.100.0.2:3200).
# Goes next to the production server block on 89.207.255.79. It never proxies to :3000 / :8080 (production).
# Account creation is blocked here; dev accounts are made by hand in the dev database.

# --- http {} level (e.g. /etc/nginx/conf.d/uf-dev-limits.conf) ---
limit_req_zone $binary_remote_addr zone=uf_dev_api:10m   rate=100r/s;  # a modpack install fetches thousands of files
limit_req_zone $binary_remote_addr zone=uf_dev_login:10m rate=30r/m;   # slows password guessing

server {
    server_name dev.unrealfrontiers.com;

    client_max_body_size 50M;

    # No account creation or account-creating flows on dev.
    location ~ ^/auth/(create_account|auth_discord|complete_discord_auth_session|request_password_reset|send_reset_password_email) {
        default_type application/json;
        return 403 '{"error":"Account registration is disabled on the dev backend"}';
    }

    location = /auth/login {
        limit_req zone=uf_dev_login burst=10 nodelay;
        proxy_pass http://10.100.0.2:3200;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/(auth|schematics|leaderboard|server-management|updateclient|healthcheck|openapi|api-docs) {
        limit_req zone=uf_dev_api burst=300 nodelay;
        proxy_pass http://10.100.0.2:3200;
        include /etc/nginx/proxy_params;
    }

    # No web panel / SPA on the public dev name.
    location / {
        return 404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dev.unrealfrontiers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.unrealfrontiers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.unrealfrontiers.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

