name: CI

# Tests on every pull request and on pushes to feature branches, on both systems the launcher ships for.
# The Linux job also builds the Linux package layout the release uses, without publishing.
on:
  pull_request:
    branches: [development, master]
  push:
    branches-ignore: [development, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tests --nologo

      # The Windows installer shell embeds a Velopack Setup.exe; any file stands in for it to check that the shell compiles.
      - name: Build the installer shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content "$env:RUNNER_TEMP/Setup.exe" 'placeholder'
          dotnet build Packaging/InstallerStub/InstallerStub.csproj -c Release -o "$env:RUNNER_TEMP/stub" "-p:SetupExe=$env:RUNNER_TEMP/Setup.exe" -v q

      - name: Install the packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools zstd
          dotnet tool install --global vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build the Linux package
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./Packaging/build-linux.ps1 -Dev -Version 0.0.1-ci.${{ github.run_number }} -ServerUrl https://dev.unrealfrontiers.com -OutputDir "$env:RUNNER_TEMP/linux"
