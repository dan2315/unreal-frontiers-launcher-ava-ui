  id: dod.unrealfrontiers.launcher
  runtime: org.freedesktop.Platform
  runtime-version: '23.08'
  sdk: org.freedesktop.Sdk
  sdk-extensions:
    - org.freedesktop.Sdk.Extension.dotnet8
  build-options:
    prepend-path: "/usr/lib/sdk/dotnet8/bin"
    append-ld-library-path: "/usr/lib/sdk/dotnet8/lib"
    prepend-pkg-config-path: "/usr/lib/sdk/dotnet8/lib/pkgconfig"
  
  command: UnrealFrontiersLauncher
  
  finish-args:
    - --share=network
    - --device=dri
    # TODO: Replace this with wayland and fallback-x11 once Wayland support
    #       becomes available:
    #       https://github.com/AvaloniaUI/Avalonia/pull/8003
    - --socket=x11
    - --share=ipc
    - --env=DOTNET_ROOT=/app/lib/dotnet
  
  modules:
    - name: dotnet
      buildsystem: simple
      build-commands:
      - /usr/lib/sdk/dotnet8/bin/install.sh
  
    - name: UnrealFrontiersLauncher
      buildsystem: simple
      sources:
      - type: dir
        path: ../../unreal-frontiers-launcher
      - type: file
        path: nuget-sources.json
      - type: file
        path: "dod.unrealfrontiers.launcher.desktop"
      build-commands:
        - install -Dm644 dod.unrealfrontiers.launcher.desktop /app/share/applications/dod.unrealfrontiers.launcher.desktop
        - dotnet publish unreal-frontiers-launcher.csproj -c Release --no-self-contained --source ./flatpak-builder/nuget-sources -p:DefineConstants=LINUX
        - mkdir -p ${FLATPAK_DEST}/bin
        - cp -r bin/Release/net8.0/publish/* ${FLATPAK_DEST}/bin
